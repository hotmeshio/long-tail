# Bambu printers on the machine line: layered on docker-compose.machines.yml.
# The machine broker bridges out to each enabled printer's own broker (see
# examples/workflows/bambu-printer/README.md), JetStream keeps every report,
# and Long Tail runs the gateway with the Bambu codec. Printers are described
# in .env (BAMBU_PRINTERS and BAMBU_<STATION>_*); the mock line is left off.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nats.yml -f docker-compose.machines.yml \
#     -f docker-compose.bambu.yml up -d --build
# Without a printer, add `--profile bambu-sim` and describe the simulated
# printer in .env (.env.example has the block): bambu-sim plays a printer on
# the network, its broker on 8883 and its storage on 990, drills on :8092.

services:
  long-tail:
    environment:
      MACHINE_LINE_CONFIG: /etc/site/line.json
      MACHINE_CODEC_MODULE: /app/examples/workflows/bambu-printer/codec.ts
      MACHINE_LIFECYCLE: "on"
      MACHINE_PROGRESS_STEP: ${MACHINE_PROGRESS_STEP:-25}
      MACHINE_QUIET_MS: ${MACHINE_QUIET_MS:-0}
    volumes:
      - ./deploy/bambu-site:/etc/site:ro

  machine-site:
    env_file:
      - path: .env
        required: false
    environment:
      MACHINE_SITE_DIR: /app/deploy/bambu-site
    command: ["npx", "ts-node", "--transpile-only", "examples/workflows/bambu-printer/site/setup.ts"]
    depends_on:
      bambu-sim-broker:
        condition: service_healthy
        required: false

  site-nats:
    volumes:
      - ./deploy/bambu-site:/etc/site:ro

  machine-broker:
    volumes:
      - ./deploy/bambu-site/mosquitto:/mosquitto/config:ro
      - ./deploy/bambu-site/certs:/certs:ro

  machine-mock:
    profiles: ["mock"]

  bambu-sim:
    profiles: ["bambu-sim"]
    build:
      context: .
      target: development
    entrypoint: []
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      BAMBU_SIM_STATION: ${BAMBU_SIM_STATION:-p1s-01}
      BAMBU_SIM_DIR: /app/deploy/bambu-sim
      BAMBU_SIM_PORT: "8092"
    ports:
      - "${BAMBU_SIM_DRILL_PORT:-8092}:8092"
    command: ["npx", "ts-node", "--transpile-only", "examples/workflows/bambu-printer/sim/main.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(990, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The simulated printer's own broker, on bambu-sim's address.
  bambu-sim-broker:
    profiles: ["bambu-sim"]
    image: eclipse-mosquitto:2.0.20
    network_mode: service:bambu-sim
    volumes:
      - ./deploy/bambu-sim:/sim:ro
    command: ["mosquitto", "-c", "/sim/mosquitto.conf"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8883"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      bambu-sim:
        condition: service_healthy
    restart: unless-stopped
